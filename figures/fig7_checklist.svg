<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect x="0" y="0" width="1100" height="560" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Before you design a comparison page, ask four questions</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Call to action for product teams, with where each one shows up in version 3</text><circle cx="84" cy="160" r="22" fill="#2563a8"/><text x="84" y="167" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="white" font-weight="bold" text-anchor="middle">1</text><text x="125" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2937" font-weight="bold" text-anchor="start">Is this number about this user?</text><text x="125" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">Relevance: "people your age", "if you see a doctor once or twice a year"</text><circle cx="84" cy="252" r="22" fill="#2563a8"/><text x="84" y="259" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="white" font-weight="bold" text-anchor="middle">2</text><text x="125" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2937" font-weight="bold" text-anchor="start">Does it show the range, not just one guess?</text><text x="125" y="274" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">Uncertainty: typical year, bad year and worst case</text><circle cx="84" cy="344" r="22" fill="#2563a8"/><text x="84" y="351" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="white" font-weight="bold" text-anchor="middle">3</text><text x="125" y="340" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2937" font-weight="bold" text-anchor="start">Would it change their choice?</text><text x="125" y="366" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">Decision impact: the break-even point that splits the two groups</text><circle cx="84" cy="436" r="22" fill="#c2410c"/><text x="84" y="443" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="white" font-weight="bold" text-anchor="middle">4</text><text x="125" y="432" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" fill="#1f2937" font-weight="bold" text-anchor="start">Does a sentence say what it means for their life?</text><text x="125" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">Motivation: "bad years are rare, but they're the year insurance is for"</text><text x="60" y="510" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">Then test it: A/B test the old page against the new one on comprehension, choice quality and trust, not just clicks.</text><text x="60" y="536" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: Questions 1-3 draw on Samek &amp; Sydnor (2020); question 4 is this project's hypothesis.</text></svg>