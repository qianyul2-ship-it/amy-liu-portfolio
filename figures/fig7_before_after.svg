<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect x="0" y="0" width="1200" height="640" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Same plans, same data. Which page helps someone choose?</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Before: the terms of each plan. After: the numbers that answer the user's real question.</text><text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="bold" text-anchor="start">BEFORE</text><rect x="60" y="150" width="520" height="400" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1.5"/><rect x="75" y="170" width="490" height="36" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="91" y="193.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start"></text><text x="359.2" y="193.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="486.59999999999997" y="193.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="359.2" y="206.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Bronze</text><text x="486.59999999999997" y="206.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Gold</text><line x1="75" y1="250" x2="565" y2="250" stroke="#e5e7eb" stroke-width="1"/><text x="91" y="237.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Monthly premium</text><text x="359.2" y="237.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$247</text><text x="486.59999999999997" y="237.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$342</text><line x1="75" y1="286" x2="565" y2="286" stroke="#e5e7eb" stroke-width="1"/><text x="91" y="273.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Deductible</text><text x="359.2" y="273.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$6,700</text><text x="486.59999999999997" y="273.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$1,000</text><line x1="75" y1="322" x2="565" y2="322" stroke="#e5e7eb" stroke-width="1"/><text x="91" y="309.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Coinsurance</text><text x="359.2" y="309.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">40%</text><text x="486.59999999999997" y="309.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">30%</text><line x1="75" y1="358" x2="565" y2="358" stroke="#e5e7eb" stroke-width="1"/><text x="91" y="345.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Out-of-pocket maximum</text><text x="359.2" y="345.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$10,600</text><text x="486.59999999999997" y="345.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$7,500</text><line x1="75" y1="394" x2="565" y2="394" stroke="#e5e7eb" stroke-width="1"/><text x="91" y="381.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Plan type / network</text><text x="359.2" y="381.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="486.59999999999997" y="381.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="80" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">The user has to do the math:</text><text x="80" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">deductibles, coinsurance and an unknown year.</text><text x="80" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">Most people can't (Figure 3).</text><path d="M598 350 L630 350 M620 340 L632 350 L620 360" fill="none" stroke="#9ca3af" stroke-width="3"/><text x="650" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#c2410c" font-weight="bold" text-anchor="start">AFTER</text><rect x="650" y="150" width="490" height="400" rx="10" fill="white" stroke="#c2410c" stroke-width="2"/><text x="670" y="185" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">For people your age (22-30), each year:</text><rect x="670" y="205" width="450" height="64" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="686" y="243" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Typical year</text><text x="925" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="925" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="middle">$3,723</text><text x="1050" y="235" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="1050" y="257" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#e07b39" font-weight="bold" text-anchor="middle">$4,866</text><rect x="670" y="283" width="450" height="64" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="686" y="321" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Bad year (1 in 10)</text><text x="925" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="925" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="middle">$10,617</text><text x="1050" y="313" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="1050" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#e07b39" font-weight="bold" text-anchor="middle">$7,531</text><rect x="670" y="361" width="450" height="64" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="686" y="399" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Worst case</text><text x="925" y="391" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="925" y="413" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="middle">$13,561</text><text x="1050" y="391" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="1050" y="413" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#e07b39" font-weight="bold" text-anchor="middle">$11,604</text><text x="670" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">Plan A is cheaper for 70 of 100 people your age.</text><text x="670" y="494" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">If you expect more than $2,633 in medical</text><text x="670" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">bills this year, Plan B is likely cheaper.</text><text x="60" y="588" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Design takeaway: lead with the number that's about the user (relevance), show the range (uncertainty), and say who each plan fits (decision impact).</text><text x="60" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: CMS 2026 Pennsylvania plan files (premiums for a 26-year-old, Allegheny County); MEPS 2023, ages 22-30, weighted. Draft mockup; simplified cost model.</text></svg>