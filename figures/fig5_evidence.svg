<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600"><rect x="0" y="0" width="1100" height="600" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Showing people what they'd pay halves the wrong choices</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Share who chose a plan that was worse for them in every case, by what they were shown</text><text x="385" y="184" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="end">Plan table only</text><rect x="400" y="162" width="550" height="40" rx="4" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="962" y="189" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#4b5563" font-weight="bold" text-anchor="start">50%</text><text x="385" y="264" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="end">Table + expected yearly cost</text><rect x="400" y="242" width="385" height="40" rx="4" fill="#93b4dc" stroke="none" stroke-width="1"/><text x="797" y="269" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#4b5563" font-weight="bold" text-anchor="start">about 35%</text><text x="385" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="end">Table + range of possible yearly costs</text><rect x="400" y="322" width="264" height="40" rx="4" fill="#2563a8" stroke="none" stroke-width="1"/><text x="676" y="349" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" fill="#2563a8" font-weight="bold" text-anchor="start">24%</text><text x="60" y="430" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">A single average helps; showing the whole range helps about twice as much.</text><text x="60" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">What this study measured: choosing the right plan. What it didn't: whether people feel moved to act.</text><text x="60" y="482" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">That second part, the words around the numbers, is what this project's interviews test.</text><text x="60" y="576" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: Samek &amp; Sydnor (2020), NBER Working Paper 28003; online experiment, 692 U.S. adults. 'About 35%' is derived from reported effects.</text></svg>