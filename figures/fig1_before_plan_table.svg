<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="540" viewBox="0 0 1100 540"><rect x="0" y="0" width="1100" height="540" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Which plan would you choose?</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Two real 2026 plans sold in Pittsburgh by the same insurer, shown the way plan pages usually show them</text><rect x="60" y="125" width="640" height="44" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="76" y="153.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start"></text><text x="431.2" y="153.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="597.6" y="153.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="431.2" y="169.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Bronze</text><text x="597.6" y="169.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Gold</text><line x1="60" y1="221" x2="700" y2="221" stroke="#e5e7eb" stroke-width="1"/><text x="76" y="205.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">Monthly premium</text><text x="431.2" y="205.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$247</text><text x="597.6" y="205.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$342</text><line x1="60" y1="265" x2="700" y2="265" stroke="#e5e7eb" stroke-width="1"/><text x="76" y="249.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">Deductible</text><text x="431.2" y="249.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$6,700</text><text x="597.6" y="249.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$1,000</text><line x1="60" y1="309" x2="700" y2="309" stroke="#e5e7eb" stroke-width="1"/><text x="76" y="293.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">Coinsurance</text><text x="431.2" y="293.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">40%</text><text x="597.6" y="293.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">30%</text><line x1="60" y1="353" x2="700" y2="353" stroke="#e5e7eb" stroke-width="1"/><text x="76" y="337.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">Out-of-pocket maximum</text><text x="431.2" y="337.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$10,600</text><text x="597.6" y="337.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">$7,500</text><line x1="60" y1="397" x2="700" y2="397" stroke="#e5e7eb" stroke-width="1"/><text x="76" y="381.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">Plan type / network</text><text x="431.2" y="381.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="597.6" y="381.6" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="750" y="150" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">What a user has to work out alone</text><circle cx="760" cy="185" r="11" fill="#c2410c"/><text x="760" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">1</text><text x="782" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Plan A saves $1,143 a year</text><text x="782" y="210" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">in premiums. Is that worth it?</text><circle cx="760" cy="255" r="11" fill="#c2410c"/><text x="760" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">2</text><text x="782" y="260" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">What does a $6,700 deductible</text><text x="782" y="280" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">mean for my bills this year?</text><circle cx="760" cy="325" r="11" fill="#c2410c"/><text x="760" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">3</text><text x="782" y="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">What is 40% coinsurance</text><text x="782" y="350" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">of a bill I can't predict?</text><circle cx="760" cy="395" r="11" fill="#c2410c"/><text x="760" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="bold" text-anchor="middle">4</text><text x="782" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Which plan is cheaper</text><text x="782" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">for someone like me?</text><text x="60" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start">Every number is accurate, but none of them answers the question the user actually has.</text><text x="60" y="516" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: CMS 2026 Pennsylvania plan files (premiums for a 26-year-old, Allegheny County).</text></svg>