<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760"><rect x="0" y="0" width="1500" height="760" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Same plans, three pages: terms, numbers, or numbers with words</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Which page helps someone choose, and which makes them want to act?</text><text x="60" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="bold" text-anchor="start">1  TERMS (today)</text><rect x="60" y="142" width="440" height="500" rx="10" fill="white" stroke="#e5e7eb" stroke-width="1.5"/><text x="530" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-weight="bold" text-anchor="start">2  NUMBERS</text><rect x="530" y="142" width="440" height="500" rx="10" fill="white" stroke="#2563a8" stroke-width="2"/><text x="1000" y="130" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">3  NUMBERS + WORDS</text><rect x="1000" y="142" width="440" height="500" rx="10" fill="white" stroke="#c2410c" stroke-width="2"/><rect x="72" y="160" width="416" height="36" rx="6" fill="#f3f4f6" stroke="none" stroke-width="1"/><text x="88" y="183.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start"></text><text x="313.28" y="183.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="421.44" y="183.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="313.28" y="196.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Bronze</text><text x="421.44" y="196.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="12" fill="#4b5563" font-weight="normal" text-anchor="middle">Gold</text><line x1="72" y1="240" x2="488" y2="240" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="227.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Monthly premium</text><text x="313.28" y="227.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$247</text><text x="421.44" y="227.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$342</text><line x1="72" y1="276" x2="488" y2="276" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="263.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Deductible</text><text x="313.28" y="263.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$6,700</text><text x="421.44" y="263.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$1,000</text><line x1="72" y1="312" x2="488" y2="312" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="299.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Coinsurance</text><text x="313.28" y="299.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">40%</text><text x="421.44" y="299.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">30%</text><line x1="72" y1="348" x2="488" y2="348" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="335.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Out-of-pocket maximum</text><text x="313.28" y="335.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$10,600</text><text x="421.44" y="335.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">$7,500</text><line x1="72" y1="384" x2="488" y2="384" stroke="#e5e7eb" stroke-width="1"/><text x="88" y="371.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Plan type / network</text><text x="313.28" y="371.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="421.44" y="371.4" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="middle">EPO</text><text x="80" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">Every term is there.</text><text x="80" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">The user still has to do the math.</text><text x="550" y="180" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">For people aged 22-30, each year:</text><rect x="546" y="200" width="408" height="60" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="560" y="236" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Typical year</text><text x="785" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="785" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#2563a8" font-weight="bold" text-anchor="middle">$3,723</text><text x="890" y="226" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="890" y="248" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#e07b39" font-weight="bold" text-anchor="middle">$4,866</text><rect x="546" y="272" width="408" height="60" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="560" y="308" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Bad year (1 in 10)</text><text x="785" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="785" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#2563a8" font-weight="bold" text-anchor="middle">$10,617</text><text x="890" y="298" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="890" y="320" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#e07b39" font-weight="bold" text-anchor="middle">$7,531</text><rect x="546" y="344" width="408" height="60" rx="8" fill="#f9fafb" stroke="none" stroke-width="1"/><text x="560" y="380" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Worst case</text><text x="785" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#2563a8" font-weight="bold" text-anchor="middle">Plan A</text><text x="785" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#2563a8" font-weight="bold" text-anchor="middle">$13,561</text><text x="890" y="370" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="11" fill="#e07b39" font-weight="bold" text-anchor="middle">Plan B</text><text x="890" y="392" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#e07b39" font-weight="bold" text-anchor="middle">$11,604</text><text x="550" y="445" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="bold" text-anchor="start">Plan A is cheaper for 70 of 100 people your age.</text><text x="1020" y="182" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">If you see a doctor once or twice a year</text><text x="1020" y="208" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-weight="bold" text-anchor="start">Plan A likely saves you about $1,100 a year.</text><text x="1020" y="234" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">70 of 100 people your age come out ahead with it.</text><text x="1020" y="278" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">If you expect more than $2,633 in medical bills</text><text x="1020" y="304" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">(ongoing visits, a planned procedure)</text><text x="1020" y="329" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#e07b39" font-weight="bold" text-anchor="start">Plan B costs about $3,100 less in a bad year.</text><text x="1020" y="374" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="bold" text-anchor="start">Not sure which group you're in?</text><text x="1020" y="400" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">Count last year's doctor visits. It's a good first clue.</text><text x="1020" y="444" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">Bad years are rare, but they're the year</text><text x="1020" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="start">insurance is for.</text><rect x="1020" y="570" width="400" height="44" rx="8" fill="#c2410c" stroke="none" stroke-width="1"/><text x="1220.0" y="598" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="white" font-weight="bold" text-anchor="middle">Estimate my year in 2 minutes</text><text x="60" y="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#1f2937" font-weight="normal" text-anchor="start">Evidence so far: numbers (2) help people choose correctly (Figure 5). Whether words (3) make people more willing to act is the hypothesis my interviews test.</text><text x="60" y="736" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: CMS 2026 Pennsylvania plan files (premiums for a 26-year-old, Allegheny County); MEPS 2023, ages 22-30, weighted. Draft mockups; simplified cost model.</text></svg>