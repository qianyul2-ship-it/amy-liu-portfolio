<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect x="0" y="0" width="1200" height="640" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Different people need a different number first</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">Two groups the plan table fails, people aged 22-35</text><text x="60" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="bold" text-anchor="start">IF YOU SEE A DOCTOR OFTEN</text><text x="60" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" font-weight="bold" text-anchor="start">The lowest premium can cost you more</text><text x="188" y="230" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">Under $100</text><rect x="200" y="211" width="286.0" height="30" rx="3" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="496.0" y="232" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="bold" text-anchor="start">65 of 100</text><text x="188" y="286" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$100-1,000</text><rect x="200" y="267" width="35.2" height="30" rx="3" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="245.2" y="288" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="bold" text-anchor="start">8 of 100</text><text x="188" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$1,000 or more</text><rect x="200" y="323" width="118.80000000000001" height="30" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><text x="328.8" y="344" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">27 of 100</text><text x="60" y="395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">Extra cost for the year if everyone aged 22-30 picked</text><text x="60" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">the lowest-premium plan (vs. their own cheapest plan).</text><text x="60" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">27 of 100 would pay $1,000+ more;</text><text x="60" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="normal" text-anchor="start">7 in 10 of them saw a doctor 5+ times that year.</text><text x="60" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#2563a8" font-weight="bold" text-anchor="start">Show them: their yearly total, not just the premium.</text><line x1="600" y1="130" x2="600" y2="560" stroke="#e5e7eb" stroke-width="1"/><text x="640" y="140" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#c2410c" font-weight="bold" text-anchor="start">IF YOU HAVE LITTLE SAVED</text><text x="640" y="172" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#1f2937" font-weight="bold" text-anchor="start">The worst case is far beyond reach</text><text x="640" y="207" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">Emergency money half of under-35s couldn't raise</text><rect x="640" y="213" width="89.09090909090912" height="28" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><text x="737.0909090909091" y="233" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#c2410c" font-weight="bold" text-anchor="start">$2,000</text><text x="640" y="263" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">Bronze worst case</text><rect x="640" y="269" width="472.18181818181824" height="28" rx="3" fill="#2563a8" stroke="none" stroke-width="1"/><text x="1120.1818181818182" y="289" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-weight="bold" text-anchor="start">$10,600</text><text x="640" y="319" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">Gold worst case</text><rect x="640" y="325" width="334.090909090909" height="28" rx="3" fill="#2563a8" stroke="none" stroke-width="1"/><text x="982.090909090909" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#2563a8" font-weight="bold" text-anchor="start">$7,500</text><text x="640" y="395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">Median out-of-pocket maximum, 2026 plans sold in Allegheny</text><text x="640" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">County, vs. $2,000 in emergency money.</text><text x="640" y="460" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="bold" text-anchor="start">About 1 in 2 adults under 35 couldn't raise $2,000</text><text x="640" y="484" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#1f2937" font-weight="normal" text-anchor="start">within a month (49% aged 18-24, 47% aged 25-34).</text><text x="640" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">Show them: the worst case, before anything else.</text><text x="60" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: MEPS 2023 x 72 CMS 2026 plans in Allegheny County (simplified cost model); FINRA Foundation NFCS 2024, weighted.</text></svg>