<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590"><rect x="0" y="0" width="1100" height="590" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="62" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="27" fill="#1f2937" font-weight="bold" text-anchor="start">Showing only the premium works for most people in their 20s, but not all</text><text x="60" y="93" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="normal" text-anchor="start">If everyone aged 22-30 picked the lowest-premium plan: extra cost vs. the plan that would have been cheapest for them</text><text x="215" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="bold" text-anchor="end">Extra cost for the year</text><text x="230" y="138" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="bold" text-anchor="start">People out of 100</text><text x="215" y="177" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">Under $100</text><rect x="230" y="158" width="390.0" height="30" rx="3" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="630.0" y="179" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="bold" text-anchor="start">65</text><text x="215" y="229" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$100-500</text><rect x="230" y="210" width="24.0" height="30" rx="3" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="264.0" y="231" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="bold" text-anchor="start">4</text><text x="215" y="281" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$500-1,000</text><rect x="230" y="262" width="24.0" height="30" rx="3" fill="#d1d5db" stroke="none" stroke-width="1"/><text x="264.0" y="283" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#4b5563" font-weight="bold" text-anchor="start">4</text><text x="215" y="333" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$1,000-2,000</text><rect x="230" y="314" width="42.0" height="30" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><text x="282.0" y="335" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">7</text><text x="215" y="385" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$2,000-5,000</text><rect x="230" y="366" width="78.0" height="30" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><text x="318.0" y="387" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">13</text><text x="215" y="437" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#1f2937" font-weight="normal" text-anchor="end">$5,000 or more</text><rect x="230" y="418" width="42.0" height="30" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><text x="282.0" y="439" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="start">7</text><path d="M358.0 314 L370.0 314 L370.0 456 L358.0 456" fill="none" stroke="#c2410c" stroke-width="2"/><text x="760" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#4b5563" font-weight="bold" text-anchor="start">65 of 100</text><text x="760" y="218" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">paid about the same as</text><text x="760" y="240" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">their cheapest plan</text><text x="760" y="345" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" fill="#c2410c" font-weight="bold" text-anchor="start">27 of 100</text><text x="760" y="373" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">paid at least $1,000 more.</text><text x="760" y="395" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">7 in 10 of them saw a doctor</text><text x="760" y="417" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="start">5 or more times that year</text><text x="60" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="start">Lowest-premium plan: a Bronze plan with a $6,700 deductible and a $10,600 out-of-pocket maximum.</text><text x="60" y="566" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Source: MEPS 2023 (ages 22-30, weighted) x 72 plans sold in Allegheny County, 2026 (CMS). Simplified cost model.</text></svg>