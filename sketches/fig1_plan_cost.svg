<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640"><rect x="0" y="0" width="1100" height="640" rx="0" fill="white" stroke="none" stroke-width="1"/><text x="60" y="64" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="28" fill="#1f2937" font-weight="bold" text-anchor="start">A cheaper monthly premium doesn't always mean a cheaper year</text><text x="60" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#4b5563" font-weight="normal" text-anchor="start">Total for the year (premiums + medical bills), by how much medical care you use</text><line x1="140" y1="500.0" x2="900" y2="500.0" stroke="#9ca3af" stroke-width="1"/><text x="128" y="505.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="end">$0</text><line x1="140" y1="412.5" x2="900" y2="412.5" stroke="#e5e7eb" stroke-width="1"/><text x="128" y="417.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="end">$2k</text><line x1="140" y1="325.0" x2="900" y2="325.0" stroke="#e5e7eb" stroke-width="1"/><text x="128" y="330.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="end">$4k</text><line x1="140" y1="237.5" x2="900" y2="237.5" stroke="#e5e7eb" stroke-width="1"/><text x="128" y="242.5" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="end">$6k</text><line x1="140" y1="150.0" x2="900" y2="150.0" stroke="#e5e7eb" stroke-width="1"/><text x="128" y="155.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="end">$8k</text><text x="200" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">No doctor</text><text x="200" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">visits</text><text x="370" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">A few</text><text x="370" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">visits</text><text x="540" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">One ER</text><text x="540" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">visit</text><text x="710" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">Short hospital</text><text x="710" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">stay</text><text x="880" y="528" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">Major</text><text x="880" y="547" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#4b5563" font-weight="normal" text-anchor="middle">illness</text><path d="M200 421.25 L370 386.25 L540 298.75 L710 193.75 L880 193.75" fill="none" stroke="#2563a8" stroke-width="4"/><circle cx="200" cy="421.25" r="5" fill="#2563a8"/><circle cx="370" cy="386.25" r="5" fill="#2563a8"/><circle cx="540" cy="298.75" r="5" fill="#2563a8"/><circle cx="710" cy="193.75" r="5" fill="#2563a8"/><circle cx="880" cy="193.75" r="5" fill="#2563a8"/><path d="M200 342.5 L370 329.375 L540 298.75 L710 255.0 L880 255.0" fill="none" stroke="#e07b39" stroke-width="4"/><circle cx="200" cy="342.5" r="5" fill="#e07b39"/><circle cx="370" cy="329.375" r="5" fill="#e07b39"/><circle cx="540" cy="298.75" r="5" fill="#e07b39"/><circle cx="710" cy="255.0" r="5" fill="#e07b39"/><circle cx="880" cy="255.0" r="5" fill="#e07b39"/><text x="898" y="198.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#2563a8" font-weight="bold" text-anchor="start">Plan A</text><text x="898" y="218.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">low premium,</text><text x="898" y="235.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">high deductible</text><text x="898" y="260.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" fill="#e07b39" font-weight="bold" text-anchor="start">Plan B</text><text x="898" y="280.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">high premium,</text><text x="898" y="297.0" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="start">low deductible</text><text x="210" y="455.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="bold" text-anchor="start">Plan A is cheaper</text><text x="210" y="473.25" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="normal" text-anchor="start">in a healthy year</text><text x="700" y="175.75" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="14" fill="#2563a8" font-weight="bold" text-anchor="end">Plan A costs more in a bad year</text><text x="60" y="616" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Example values f