art" >people aged 22-30 spent more than</text><text x="580" y="292" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24334b" font-weight="normal" text-anchor="start" >the threshold last year</text><text x="580" y="340" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#24334b" font-weight="bold" text-anchor="start" >Why an icon array, not a box plot:</text><text x="580" y="365" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="start" >spending is very skewed (many near $0,</text><text x="580" y="387" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="start" >a few very high). "X out of 100 people</text><text x="580" y="409" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="start" >like you" is easier to feel than a</text><text x="580" y="431" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="start" >percentile, and it is itself an example</text><text x="580" y="453" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="start" >of showing 'the number that's about you.'</text><text x="65" y="598" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707d8c" font-weight="normal" text-anchor="start" >Illustrative placeholder: highlighted count is not a result. Values will come from MEPS HC-251 with person weights.</text></svg>