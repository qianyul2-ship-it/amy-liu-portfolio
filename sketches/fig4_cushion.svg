end">$7,500</text><text x="185" y="412" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="normal" text-anchor="end">Platinum</text><rect x="200" y="392" width="363.6363636363636" height="32" rx="3" fill="#2563a8" stroke="none" stroke-width="1"/><text x="553.6363636363636" y="414" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="white" font-weight="bold" text-anchor="end">$5,000</text><rect x="200" y="170" width="145.4545454545455" height="270" rx="0" fill="#fdecdf" stroke="none" stroke-width="1"/><rect x="200" y="206" width="145.4545454545455" height="32" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><rect x="200" y="268" width="145.4545454545455" height="32" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><rect x="200" y="330" width="145.4545454545455" height="32" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><rect x="200" y="392" width="145.4545454545455" height="32" rx="3" fill="#c2410c" stroke="none" stroke-width="1"/><line x1="345.4545454545455" y1="165" x2="345.4545454545455" y2="450" stroke="#c2410c" stroke-width="2"/><text x="345.4545454545455" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#c2410c" font-weight="bold" text-anchor="middle">$2,000</text><text x="200.0" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$0</text><text x="345.4545454545455" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$2k</text><text x="490.90909090909093" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$4k</text><text x="636.3636363636364" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$6k</text><text x="781.8181818181819" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$8k</text><text x="927.2727272727273" y="470" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#4b5563" font-weight="normal" text-anchor="middle">$10k</text><text x="60" y="520" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#1f2937" font-weight="bold" text-anchor="start">About 1 in 2 adults under 35 said they couldn't come up with $2,000 within a month</text><text x="60" y="544" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="15" fill="#4b5563" font-weight="normal" text-anchor="start">(49% of those aged 18-24, 47% of those aged 25-34). Orange = that $2,000; blue = the rest of the worst case.</text><text x="60" y="596" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" fill="#9ca3af" font-weight="normal" text-anchor="start">Sources: CMS Pennsylvania 2026 plan files (median out-of-pocket maximum by metal level); FINRA Foundation NFCS 2024, weighted.</text></svg>