<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="#f7f8fb"/><rect x="48" y="42" width="984" height="570" rx="20" fill="white" stroke="#d4dae4" stroke-width="2"/><text x="86" y="104" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#18263a">ACTS 3 & 4  |  From evidence to design</text><text x="86" y="139" font-family="Arial,sans-serif" font-size="18" fill="#5b677a">Define what matters, then present and test a decision aid.</text><rect x="80" y="180" width="440" height="160" rx="12" fill="#eff2fa" stroke="#c9d5df"/><text x="102" y="215" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">1. RELEVANCE</text><text x="102" y="247" font-family="Arial" font-size="17" fill="#344b65">User context + the actual decision</text><text x="102" y="273" font-family="Arial" font-size="17" fill="#344b65">Which scenarios matter?</text><rect x="555" y="180" width="440" height="160" rx="12" fill="#edf5f5" stroke="#c9d5df"/><text x="577" y="215" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">2. UNCERTAINTY</text><text x="577" y="247" font-family="Arial" font-size="17" fill="#344b65">Observed confusion and gaps</text><text x="577" y="273" font-family="Arial" font-size="17" fill="#344b65">What is misunderstood?</text><rect x="80" y="370" width="440" height="160" rx="12" fill="#eff2fa" stroke="#c9d5df"/><text x="102" y="405" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">3. DECISION IMPACT</text><text x="102" y="437" font-family="Arial" font-size="17" fill="#344b65">Compare possible outcomes</text><text x="102" y="463" font-family="Arial" font-size="17" fill="#344b65">Which facts might change choice?</text><rect x="555" y="370" width="440" height="160" rx="12" fill="#edf5f5" stroke="#c9d5df"/><text x="577" y="405" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">INTERACTIVE PROTOTYPE</text><text x="577" y="437" font-family="Arial" font-size="17" fill="#344b65">Toggle scenario and plan</text><text x="577" y="463" font-family="Arial" font-size="17" fill="#344b65">Show annual cost + assumptions</text><text x="84" y="584" font-family="Arial" font-size="15" fill="#69758a">LOW-FIDELITY SKETCH • text and numbers are placeholders, not research findings</text></svg>