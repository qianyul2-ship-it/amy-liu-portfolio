-family="Arial, Helvetica, sans-serif" font-size="13" fill="#58677a" font-weight="normal" text-anchor="start" >14 of 100 understand all 4 terms</text><text x="408" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >Only 14% understand the basics;</text><text x="408" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >61% chose a worse plan</text><text x="408" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24708d" font-weight="bold" text-anchor="start" >Published research</text><path d="M698 335 L716 345 L698 355 Z" fill="#58677a"/><rect x="720" y="135" width="305" height="400" rx="14" fill="white" stroke="#c9d1db" stroke-width="2"/><rect x="720" y="135" width="305" height="44" rx="14" fill="#24708d" stroke="none" stroke-width="2"/><rect x="720" y="165" width="305" height="14" rx="0" fill="#24708d" stroke="none" stroke-width="2"/><text x="738" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="start" >ACT 3  THE METHOD</text><text x="738" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="bold" text-anchor="start" >What to show, and to whom?</text><rect x="738" y="240" width="269" height="175" rx="8" fill="#eff3f6" stroke="none" stroke-width="2"/><rect x="768" y="335" width="45" height="50" rx="3" fill="#24708d" stroke="none" stroke-width="2"/><text x="790" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#58677a" font-weight="normal" text-anchor="middle" >22-30</text><rect x="848" y="305" width="45" height="80" rx="3" fill="#24708d" stroke="none" stroke-width="2"/><text x="870" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#58677a" font-weight="normal" text-anchor="middle" >31-45</text><rect x="928" y="265" width="45" height="120" rx="3" fill="#24708d" stroke="none" stroke-width="2"/><text x="950" y="405" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#58677a" font-weight="normal" text-anchor="middle" >46-64</text><text x="738" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >Spending by age (MEPS) and</text><text x="738" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >financial strain (NFCS)</text><text x="738" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24708d" font-weight="bold" text-anchor="start" >My own analysis</text><path d="M1028 335 L1046 345 L1028 355 Z" fill="#58677a"/><rect x="1050" y="135" width="305" height="400" rx="14" fill="white" stroke="#c9d1db" stroke-width="2"/><rect x="1050" y="135" width="305" height="44" rx="14" fill="#d16d51" stroke="none" stroke-width="2"/><rect x="1050" y="165" width="305" height="14" rx="0" fill="#d16d51" stroke="none" stroke-width="2"/><text x="1068" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="start" >ACT 4  THE ANSWER</text><text x="1068" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="bold" text-anchor="start" >What would I actually pay?</text><rect x="1068" y="240" width="269" height="175" rx="8" fill="#eff3f6" stroke="none" stroke-width="2"/><circle cx="1078" cy="320" r="3.5" fill="#24708d"/><circle cx="1078" cy="312" r="3.5" fill="#24708d"/><circle cx="1078" cy="304" r="3.5" fill="#24708d"/><circle cx="1078" cy="296" r="3.5" fill="#24708d"/><circle cx="1078" cy="288" r="3.5" fill="#24708d"/><circle cx="1078" cy="280" r="3.5" fill="#24708d"/><circle cx="1078" cy="272" r="3.5" fill="#24708d"/><circle cx="1088" cy="320" r="3.5" fill="#24708d"/><circle cx="1088" cy="312" r="3.5" fill="#24708d"/><circle cx="1088" cy="304" r="3.5" fill="#24708d"/><circle cx="1088" 