<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="600" viewBox="0 0 1400 600"><rect width="1400" height="600" fill="#ffffff"/><text x="60" y="62" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#24334b" font-weight="bold" text-anchor="start" >Storyboard: What Should We Show? (story structure, not a chart)</text><text x="60" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#58677a" font-weight="normal" text-anchor="start" >Key message: people aren't moved by jargon or risk. They're moved by the number that's about them.</text><rect x="60" y="135" width="305" height="400" rx="14" fill="white" stroke="#c9d1db" stroke-width="2"/><rect x="60" y="135" width="305" height="44" rx="14" fill="#24708d" stroke="none" stroke-width="2"/><rect x="60" y="165" width="305" height="14" rx="0" fill="#24708d" stroke="none" stroke-width="2"/><text x="78" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="start" >ACT 1  THE HOOK</text><text x="78" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="bold" text-anchor="start" >Which plan would you choose?</text><rect x="78" y="240" width="269" height="175" rx="8" fill="#eff3f6" stroke="none" stroke-width="2"/><rect x="93" y="255" width="120" height="70" rx="6" fill="white" stroke="#24708d" stroke-width="2"/><text x="153" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#24708d" font-weight="bold" text-anchor="middle" >Plan A</text><text x="153" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#58677a" font-weight="normal" text-anchor="middle" >$__ / month</text><rect x="228" y="255" width="120" height="70" rx="6" fill="white" stroke="#d16d51" stroke-width="2"/><text x="288" y="285" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#d16d51" font-weight="bold" text-anchor="middle" >Plan B</text><text x="288" y="308" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#58677a" font-weight="normal" text-anchor="middle" >$__ / month</text><path d="M98 400 L188 375 L328 345" fill="none" stroke="#24708d" stroke-width="3"/><path d="M98 408 L188 370 L328 362" fill="none" stroke="#d16d51" stroke-width="3"/><text x="78" y="450" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >Audience picks Plan A or B,</text><text x="78" y="472" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#58677a" font-weight="normal" text-anchor="start" >then sees a full year of costs</text><text x="78" y="510" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24708d" font-weight="bold" text-anchor="start" >Audience as user</text><path d="M368 335 L386 345 L368 355 Z" fill="#58677a"/><rect x="390" y="135" width="305" height="400" rx="14" fill="white" stroke="#c9d1db" stroke-width="2"/><rect x="390" y="135" width="305" height="44" rx="14" fill="#24708d" stroke="none" stroke-width="2"/><rect x="390" y="165" width="305" height="14" rx="0" fill="#24708d" stroke="none" stroke-width="2"/><text x="408" y="164" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="white" font-weight="bold" text-anchor="start" >ACT 2  THE PROBLEM</text><text x="408" y="215" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="bold" text-anchor="start" >Most people can't read their plan</text><rect x="408" y="240" width="269" height="175" rx="8" fill="#eff3f6" stroke="none" stroke-width="2"/><circle cx="430" cy="270" r="8" fill="#24708d"/><circle cx="454" cy="270" r="8" fill="#24708d"/><circle cx="478" cy="270" r="8" fill="#24708d"/><circle cx="502" cy="270" r="8" fill="#24708d"/><circle cx="526" cy="270" r="8" fill="#24708d"/><circle cx="550" cy="270" r="8" fill="#24708d"/><circle cx="574" cy="270" r="8" fill="#24708d"/><circle cx="598" cy="270" r="8" fill="#c9d1db"/><circle cx="622" cy="270" r="8" fill="#c9d