<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="660" viewBox="0 0 1080 660"><rect width="1080" height="660" fill="#f7f8fb"/><rect x="48" y="42" width="984" height="570" rx="20" fill="white" stroke="#d4dae4" stroke-width="2"/><text x="86" y="104" font-family="Arial,sans-serif" font-weight="700" font-size="32" fill="#18263a">ACT 1  |  Which plan would you choose?</text><text x="86" y="139" font-family="Arial,sans-serif" font-size="18" fill="#5b677a">Audience chooses first; the data story then reveals the cost trade-off.</text><rect x="80" y="180" width="440" height="160" rx="12" fill="#eff2fa" stroke="#c9d5df"/><text x="102" y="215" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">PLAN A</text><text x="102" y="247" font-family="Arial" font-size="17" fill="#344b65">Lower monthly premium</text><text x="102" y="273" font-family="Arial" font-size="17" fill="#344b65">Higher deductible</text><rect x="555" y="180" width="440" height="160" rx="12" fill="#edf5f5" stroke="#c9d5df"/><text x="577" y="215" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">PLAN B</text><text x="577" y="247" font-family="Arial" font-size="17" fill="#344b65">Higher monthly premium</text><text x="577" y="273" font-family="Arial" font-size="17" fill="#344b65">Lower deductible</text><rect x="80" y="370" width="440" height="160" rx="12" fill="#eff2fa" stroke="#c9d5df"/><text x="102" y="405" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">AUDIENCE POLL</text><text x="102" y="437" font-family="Arial" font-size="17" fill="#344b65">Choose A or B before the reveal</text><text x="102" y="463" font-family="Arial" font-size="17" fill="#344b65">Why did you choose it?</text><rect x="555" y="370" width="440" height="160" rx="12" fill="#edf5f5" stroke="#c9d5df"/><text x="577" y="405" font-family="Arial" font-size="21" font-weight="700" fill="#20334c">COST REVEAL  [line chart]</text><text x="577" y="437" font-family="Arial" font-size="17" fill="#344b65">X: assumed medical spending</text><text x="577" y="463" font-family="Arial" font-size="17" fill="#344b65">Y: annual total cost by plan</text><text x="84" y="584" font-family="Arial" font-size="15" fill="#69758a">LOW-FIDELITY SKETCH • text and numbers are placeholders, not research findings</text></svg>