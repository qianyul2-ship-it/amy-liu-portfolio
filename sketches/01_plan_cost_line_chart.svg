<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600"><rect width="1000" height="600" fill="#ffffff"/><text x="65" y="58" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#24334b" font-weight="bold" text-anchor="start" >Sketch 1 (Act 1): The cheaper premium isn't always the cheaper year</text><text x="65" y="88" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#58677a" font-weight="normal" text-anchor="start" >Total annual cost = 12 months of premium + what you pay when you get care</text><line x1="150" y1="125" x2="150" y2="460" stroke="#24334b" stroke-width="3"/><line x1="150" y1="460" x2="900" y2="460" stroke="#24334b" stroke-width="3"/><text x="80" y="300" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="normal" text-anchor="start" transform="rotate(-90 80 300)">Total annual cost ($)</text><text x="525" y="548" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#24334b" font-weight="normal" text-anchor="middle" >How much care you use in a year</text><line x1="170" y1="460" x2="170" y2="468" stroke="#24334b" stroke-width="2"/><text x="170" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="middle" >No visits</text><line x1="330" y1="460" x2="330" y2="468" stroke="#24334b" stroke-width="2"/><text x="330" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="middle" >A few visits</text><line x1="520" y1="460" x2="520" y2="468" stroke="#24334b" stroke-width="2"/><text x="520" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="middle" >One ER visit</text><line x1="730" y1="460" x2="730" y2="468" stroke="#24334b" stroke-width="2"/><text x="730" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="middle" >Hospital stay</text><line x1="880" y1="460" x2="880" y2="468" stroke="#24334b" stroke-width="2"/><text x="880" y="490" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#58677a" font-weight="normal" text-anchor="middle" >Very high use</text><path d="M170 410 L330 360 L520 250 L730 175 L880 175" fill="none" stroke="#24708d" stroke-width="5"/><circle cx="170" cy="410" r="5" fill="#24708d"/><circle cx="330" cy="360" r="5" fill="#24708d"/><circle cx="520" cy="250" r="5" fill="#24708d"/><circle cx="730" cy="175" r="5" fill="#24708d"/><circle cx="880" cy="175" r="5" fill="#24708d"/><path d="M170 350 L330 330 L520 285 L730 245 L880 245" fill="none" stroke="#d16d51" stroke-width="5"/><circle cx="170" cy="350" r="5" fill="#d16d51"/><circle cx="330" cy="330" r="5" fill="#d16d51"/><circle cx="520" cy="285" r="5" fill="#d16d51"/><circle cx="730" cy="245" r="5" fill="#d16d51"/><circle cx="880" cy="245" r="5" fill="#d16d51"/><text x="890" y="168" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#24708d" font-weight="bold" text-anchor="end" >Plan A</text><text x="890" y="238" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#d16d51" font-weight="bold" text-anchor="end" >Plan B</text><text x="890" y="268" font-family="Arial, Helvetica, sans-serif" font-size="1" fill="#24334b" font-weight="normal" text-anchor="start" ></text><rect x="170" y="135" width="300" height="70" rx="8" fill="#eff3f6" stroke="none" stroke-width="2"/><text x="184" y="160" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24708d" font-weight="normal" text-anchor="start" >Plan A: lower premium, higher deductible</text><text x="184" y="185" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#d16d51" font-weight="normal" text-anchor="start" >Plan B: higher premium, lower deductible</text><circle cx="455" cy="290" r="16" fill="none" stroke="#24334b" stroke-width="2" stroke-dasharray="4 3"/><line x1="470" y1="300" x2="560" y2="360" stroke="#24334b" stroke-width="1.5"/><text x="565" y="368" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24334b" font-weight="bold" text-anchor="start" >Crossover: past this point,</text><text x="565" y="388" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#24334b" font-weight="bold" text-anchor="start" >the 'cheap' plan costs more</text><text x="565" y="415" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#58677a" font-weight="normal" text-anchor="start" >Flat lines = out-of-pocket maximum reached</text><text x="65" y="578" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#707d8c" font-weight="normal" text-anchor="start" >Illustrative placeholder. Lines will be calculated from two real 2026 plans (CMS files) and MEPS-based care scenarios.</text></svg>